# Local production-like stack (Stage 23). DEP-002: persistence moved from
# SQLite to PostgreSQL (SQLAlchemy Core + Alembic) -- `postgres` is the
# persistence layer now; api runs `alembic upgrade head` before serving
# (see Dockerfile.api's CMD). DEP-001: api/web both take API_AUTH_TOKEN /
# NEXT_PUBLIC_API_AUTH_TOKEN, blank (no auth) unless set in .env.
#
# The browser only talks to web (same origin); web proxies /api and /ws to
# api over the compose network. api stays published on localhost too, for
# scripts and the E2E checklists. Ports are published on loopback only, on
# both IPv4 and IPv6, because "localhost" may resolve to ::1 first. postgres
# publishes no host port -- only api reaches it, over the compose network.
#
# Settings come from the gitignored .env via env_file. The Telegram
# credentials are the exception: they are passed as file-mounted secrets
# (values still sourced from .env) so they don't appear in `docker inspect`.
name: xau-sentinel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      MODE: mock  # MT5 cannot run inside a Linux container
      API_DOCS_ENABLED: "false"
      XAU_API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+psycopg://xau:${POSTGRES_PASSWORD}@postgres:5432/xau_sentinel
      # Blanked here so env_file can't expose them; the real values are
      # exported from /run/secrets by the image's entrypoint.
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      API_AUTH_TOKEN: ""  # DEP-001, same reasoning as the Telegram secrets
    secrets:
      - telegram_bot_token
      - telegram_chat_id
      - api_auth_token
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - xau-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xau_sentinel
    volumes:
      - xau-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xau -d xau_sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8000
        # DEP-001: must match the api service's API_AUTH_TOKEN. Unlike the
        # backend's copy this is NOT a Docker secret — NEXT_PUBLIC_* vars
        # are inlined into the browser-served JS bundle by design, so
        # docker-inspect confidentiality doesn't apply to it either way.
        NEXT_PUBLIC_API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    restart: unless-stopped
    logging: *default-logging

secrets:
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  telegram_chat_id:
    environment: TELEGRAM_CHAT_ID
  api_auth_token:
    environment: API_AUTH_TOKEN

volumes:
  xau-data:
  xau-postgres-data:
