# Local production-like stack (Stage 23). Two services only: the app's
# persistence layer is SQLite (raw sqlite3, no ORM/migrations), so there is
# no PostgreSQL service -- see docs/deployment/DEPLOYMENT_ISSUES.md.
# Secrets come from the gitignored .env via env_file; nothing secret is
# written in this file. Ports are bound to 127.0.0.1 only.
name: xau-sentinel

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      MODE: mock  # MT5 cannot run inside a Linux container
      XAU_API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - xau-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/market
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  xau-data:
